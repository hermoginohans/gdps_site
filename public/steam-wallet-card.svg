<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2838"/>
      <stop offset="40%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#0E141D"/>
    </linearGradient>

    <radialGradient id="steamGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00ADFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#144B7E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#171A21" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="steamPistonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E1EEF8"/>
      <stop offset="100%" stop-color="#67C1F5"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67C1F5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2A475E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber/Esports Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="640" x2="800" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
  </g>

  <!-- Glowing Aura behind Steam Logo -->
  <circle cx="400" cy="330" r="280" fill="url(#steamGlow)"/>

  <!-- Inner Tech Border -->
  <rect x="24" y="24" width="752" height="752" rx="36" fill="none" stroke="url(#cardBorder)" stroke-width="3"/>
  <rect x="36" y="36" width="728" height="728" rx="28" fill="none" stroke="#2A475E" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M48 90 L48 48 L90 48" fill="none" stroke="#67C1F5" stroke-width="4" stroke-linecap="round"/>
  <path d="M752 90 L752 48 L710 48" fill="none" stroke="#67C1F5" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 710 L48 752 L90 752" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  <path d="M752 710 L752 752 L710 752" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>

  <!-- Top Pill: Official Partner / Philippines Edition -->
  <g transform="translate(400, 85)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#14243B" stroke="#67C1F5" stroke-width="1.5"/>
    <circle cx="-112" cy="0" r="5" fill="#00FF88"/>
    <text x="-95" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#E1EEF8" letter-spacing="2">OFFICIAL PH EDITION</text>
  </g>

  <!-- STEAM OFFICIAL CRANK/PISTON LOGO -->
  <g transform="translate(400, 310) scale(4.4)" filter="url(#glow)">
    <g transform="translate(-32.5, -32.5)">
      <!-- Steam connecting rod / crank / cylinders -->
      <path d="M30.31 23.985l.003.158-7.83 11.375c-1.268-.058-2.54.165-3.748.662a8.14 8.14 0 0 0-1.498.8L.042 29.893s-.398 6.546 1.26 11.424l12.156 5.016c.6 2.728 2.48 5.12 5.242 6.27a8.88 8.88 0 0 0 11.603-4.782 8.89 8.89 0 0 0 .684-3.656L42.18 36.16l.275.005c6.705 0 12.155-5.466 12.155-12.18s-5.44-12.16-12.155-12.174c-6.702 0-12.155 5.46-12.155 12.174zm-1.88 23.05c-1.454 3.5-5.466 5.147-8.953 3.694a6.84 6.84 0 0 1-3.524-3.362l3.957 1.64a5.04 5.04 0 0 0 6.591-2.719 5.05 5.05 0 0 0-2.715-6.601l-4.1-1.695c1.578-.6 3.372-.62 5.05.077 1.7.703 3 2.027 3.696 3.72s.692 3.56-.01 5.246M42.466 32.1a8.12 8.12 0 0 1-8.098-8.113 8.12 8.12 0 0 1 8.098-8.111 8.12 8.12 0 0 1 8.1 8.111 8.12 8.12 0 0 1-8.1 8.113m-6.068-8.126a6.09 6.09 0 0 1 6.08-6.095c3.355 0 6.084 2.73 6.084 6.095a6.09 6.09 0 0 1-6.084 6.093 6.09 6.09 0 0 1-6.081-6.093z" fill="url(#steamPistonGrad)"/>
    </g>
  </g>

  <!-- Typography: STEAM -->
  <text x="400" y="525" text-anchor="middle" font-family="'Segoe UI', 'Outfit', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="12">
    STEAM
  </text>

  <!-- Typography: WALLET CODE -->
  <text x="400" y="580" text-anchor="middle" font-family="'Segoe UI', 'Outfit', -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#goldText)" letter-spacing="6">
    WALLET CODE
  </text>

  <!-- Denomination / Region Pill Banner -->
  <g transform="translate(400, 640)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#172435" stroke="#67C1F5" stroke-width="1.5"/>
    <!-- Currency PHP symbol in gold circle -->
    <circle cx="-170" cy="0" r="15" fill="#F5A623"/>
    <text x="-170" y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#0B0914">₱</text>
    
    <text x="-140" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      PHILIPPINES • ₱50 – ₱1,000
    </text>
  </g>

  <!-- Footer Info / Valve Trademark Tag -->
  <g transform="translate(400, 725)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#67C1F5" letter-spacing="3" opacity="0.8">
      VALVE CORPORATION • INSTANT EMAIL DISPATCH
    </text>
  </g>
</svg>
